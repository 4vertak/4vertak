name: Обновление терминала и дашборда (стенд, GitHub Rt, тренд)

on:
  schedule:
    - cron: '0 8 * * *' # ежедневно в 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-terminal:
    runs-on: ubuntu-24.04
    env:
      USERNAME: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Прочитать выбранную миссию
        id: mission
        shell: bash
        run: |
          mission=$(tr -d '\r\n' < .github/mission.txt)
          case "$mission" in
            ИССЛЕДОВАНИЕ|РАЗРАБОТКА|ЭКСПЕРИМЕНТ|МОДЕЛИРОВАНИЕ|РЕФАКТОРИНГ) ;;
            *) echo "Недопустимая миссия: $mission" >&2; exit 1 ;;
          esac
          echo "MISSION=$mission" >> "$GITHUB_OUTPUT"

      - name: Вычислить статус стенда
        id: stand
        shell: bash
        run: |
          owner="$USERNAME"
          query_repos='query($owner:String!) {
            user(login:$owner) {
              repositories(last:10, orderBy:{field:CREATED_AT, direction:DESC}) {
                nodes { createdAt }
              }
            }
          }'
          new_repos=$(gh api graphql -f query="$query_repos" -f owner="$owner" | \
            jq -er '[.data.user.repositories.nodes[] | select(.createdAt > (now - 2592000 | strftime("%Y-%m-%dT%H:%M:%SZ")))] | length')

          now_epoch=$(date -u +%s)
          month_ago=$(date -u -d "@$((now_epoch - 30*86400))" +%Y-%m-%dT%H:%M:%SZ)
          now=$(date -u -d "@$now_epoch" +%Y-%m-%dT%H:%M:%SZ)
          query_commits='query($owner:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$owner) {
              contributionsCollection(from:$from, to:$to) {
                totalCommitContributions
              }
            }
          }'
          commits=$(gh api graphql -f query="$query_commits" -f owner="$owner" \
            -f from="$month_ago" -f to="$now" | \
            jq -er '.data.user.contributionsCollection.totalCommitContributions | numbers')

          if [ "$new_repos" -gt 0 ]; then
            stand_status="АКТИВЕН"
            stand_color="238636"
          elif [ "$commits" -gt 0 ]; then
            stand_status="РАБОТАЕТ"
            stand_color="1F6FEB"
          else
            stand_status="ПРОСТОЙ"
            stand_color="6E7681"
          fi
          echo "STAND=$stand_status" >> "$GITHUB_OUTPUT"
          echo "STAND_COLOR=$stand_color" >> "$GITHUB_OUTPUT"

      - name: Вычислить GitHub Rt и тренд
        id: rt
        shell: bash
        run: |
          owner="$USERNAME"
          # Два непересекающихся 7-дневных периода в UTC.
          now_epoch=$(date -u +%s)
          now=$(date -u -d "@$now_epoch" +%Y-%m-%dT%H:%M:%SZ)
          week_ago=$(date -u -d "@$((now_epoch - 7*86400))" +%Y-%m-%dT%H:%M:%SZ)
          previous_end=$(date -u -d "@$((now_epoch - 7*86400 - 1))" +%Y-%m-%dT%H:%M:%SZ)
          two_weeks_ago=$(date -u -d "@$((now_epoch - 14*86400))" +%Y-%m-%dT%H:%M:%SZ)

          query='query($owner:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$owner) {
              contributionsCollection(from:$from, to:$to) {
                totalCommitContributions
              }
            }
          }'
          recent=$(gh api graphql -f query="$query" -f owner="$owner" \
            -f from="$week_ago" -f to="$now" | \
            jq -er '.data.user.contributionsCollection.totalCommitContributions | numbers')
          previous=$(gh api graphql -f query="$query" -f owner="$owner" \
            -f from="$two_weeks_ago" -f to="$previous_end" | \
            jq -er '.data.user.contributionsCollection.totalCommitContributions | numbers')

          echo "Последние 7 суток: $recent коммитов"
          echo "Предыдущие 7 суток: $previous коммитов"

          # Условный индекс изменения GitHub-активности, НЕ эпидемиологический Rt.
          if [ "$recent" -eq 0 ] && [ "$previous" -eq 0 ]; then
            rt="—"
            trend="НЕТ ДАННЫХ"
            trend_color="6E7681"
          elif [ "$previous" -eq 0 ]; then
            rt="NEW"
            trend="НОВАЯ"
            trend_color="238636"
          else
            rt=$(awk -v recent="$recent" -v previous="$previous" \
              'BEGIN { printf "%.2f", recent / previous }')
            if [ "$recent" -gt "$previous" ]; then
              trend="РОСТ"
              trend_color="238636"
            elif [ "$recent" -eq "$previous" ]; then
              trend="СТАБИЛЬНО"
              trend_color="1F6FEB"
            else
              trend="СПАД"
              trend_color="9A6700"
            fi
          fi

          echo "RT=$rt" >> "$GITHUB_OUTPUT"
          echo "TREND=$trend" >> "$GITHUB_OUTPUT"
          echo "TREND_COLOR=$trend_color" >> "$GITHUB_OUTPUT"

      - name: Обновить терминал и индикаторы
        shell: bash
        env:
          STAND: ${{ steps.stand.outputs.STAND }}
          STAND_COLOR: ${{ steps.stand.outputs.STAND_COLOR }}
          MISSION: ${{ steps.mission.outputs.MISSION }}
          RT: ${{ steps.rt.outputs.RT }}
          TREND: ${{ steps.rt.outputs.TREND }}
          TREND_COLOR: ${{ steps.rt.outputs.TREND_COLOR }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          readme = Path('README.md')
          content = readme.read_text(encoding='utf-8')

          for marker, value in [('stand_status', os.environ['STAND']),
                                ('mission', os.environ['MISSION'])]:
              pattern = rf'`[^`]*`<!-- {marker} \(dynamic\) -->'
              replacement = f'`{value}`<!-- {marker} (dynamic) -->'
              content, n = re.subn(pattern, lambda _: replacement, content)
              if n != 1:
                  raise RuntimeError(f'Ожидался один маркер {marker}, найдено: {n}')
          if content != readme.read_text(encoding='utf-8'):
              readme.write_text(content, encoding='utf-8')

          badges = Path('badges')
          badges.mkdir(exist_ok=True)
          def write_badge(name, label, value, color):
              data = {
                  'schemaVersion': 1,
                  'label': label,
                  'message': value,
                  'color': color,
                  'labelColor': '30363D',
              }
              (badges / name).write_text(
                  json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n',
                  encoding='utf-8',
              )

          write_badge('mission.json', 'Миссия', os.environ['MISSION'], '1F6FEB')
          write_badge('rt.json', 'GitHub Rt', os.environ['RT'], os.environ['TREND_COLOR'])
          write_badge('trend.json', 'Тренд', os.environ['TREND'], os.environ['TREND_COLOR'])
          write_badge('stand_status.json', 'Стенд', os.environ['STAND'], os.environ['STAND_COLOR'])
          PY

      - name: Закоммитить обновлённые показатели
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md badges/
          if ! git diff --cached --quiet; then
            git commit -m "docs: обновить показатели лаборатории (стенд, Rt, тренд)"
            git push
          fi
