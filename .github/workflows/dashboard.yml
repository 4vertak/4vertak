name: Обновление терминала и дашборда (возраст, стенд, Rt, миссия)

on:
  schedule:
    - cron: '0 8 * * *'   # каждый день в 8:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-terminal:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      USERNAME: ${{ github.repository_owner }}
      BIRTH_DATE: ${{ secrets.BIRTH_DATE }}
      EXP_START_DATE: ${{ secrets.EXP_START_DATE }}   # не используется, но пусть будет
    steps:
      - uses: actions/checkout@v4

      - name: Вычислить возраст
        id: age
        run: |
          birth_epoch=$(date -d "$BIRTH_DATE" +%s)
          now_epoch=$(date +%s)
          age_days=$(( (now_epoch - birth_epoch) / (24*3600) ))
          age_years_float=$(echo "scale=1; $age_days / 365.25" | bc)
          echo "AGE_FLOAT=$age_years_float" >> $GITHUB_OUTPUT

      - name: Вычислить статус стенда
        id: stand
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$USERNAME"
          query_repos='query($owner:String!) {
            user(login:$owner) {
              repositories(last:10, orderBy:{field:CREATED_AT, direction:DESC}) {
                nodes { createdAt }
              }
            }
          }'
          new_repos=$(gh api graphql -f query="$query_repos" -f owner="$owner" | \
            jq '[.data.user.repositories.nodes[] | select(.createdAt > (now - 2592000 | strftime("%Y-%m-%dT%H:%M:%SZ")))] | length')

          today=$(date -u +%Y-%m-%d)
          month_ago=$(date -u -d '30 days ago' +%Y-%m-%d)
          query_commits='query($owner:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$owner) {
              contributionsCollection(from:$from, to:$to) {
                totalCommitContributions
              }
            }
          }'
          commits=$(gh api graphql -f query="$query_commits" -f owner="$owner" \
            -f from="${month_ago}T00:00:00Z" -f to="${today}T23:59:59Z" | \
            jq '.data.user.contributionsCollection.totalCommitContributions')

          if [ "$new_repos" -gt 0 ]; then
            stand_status="АКТИВЕН"
          elif [ "$commits" -gt 0 ]; then
            stand_status="РАБОТАЕТ"
          else
            stand_status="ПРОСТОЙ"
          fi
          echo "STAND=$stand_status" >> $GITHUB_OUTPUT

      - name: Вычислить Rt, статус и миссию
        id: rt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$USERNAME"
          today=$(date -u +%Y-%m-%d)
          week_ago=$(date -u -d '7 days ago' +%Y-%m-%d)
          two_weeks_ago=$(date -u -d '14 days ago' +%Y-%m-%d)

          query='query($owner:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$owner) {
              contributionsCollection(from:$from, to:$to) {
                totalCommitContributions
              }
            }
          }'
          recent=$(gh api graphql -f query="$query" -f owner="$owner" -f from="${week_ago}T00:00:00Z" -f to="${today}T23:59:59Z" | jq '.data.user.contributionsCollection.totalCommitContributions')
          previous=$(gh api graphql -f query="$query" -f owner="$owner" -f from="${two_weeks_ago}T00:00:00Z" -f to="${week_ago}T23:59:59Z" | jq '.data.user.contributionsCollection.totalCommitContributions')

          # Логирование
          echo "Recent commits (last 7d): $recent"
          echo "Previous commits (7-14d ago): $previous"

          if [ "$recent" -eq 0 ] && [ "$previous" -eq 0 ]; then
            rt=0.0
            rt_color="lightgrey"
            status_msg="Нет данных"
            mission="ПОИСК ДАННЫХ"
          else
            if [ "$previous" -eq 0 ] && [ "$recent" -gt 0 ]; then
              rt=0.1
            else
              rt=$(echo "scale=2; $previous / ($recent + 0.01)" | bc)
            fi

            if (( $(echo "$rt >= 1.5" | bc -l) )); then
              status_msg="Собираю эпидданные"
              rt_color="orange"
              mission="ЛИКВИДАЦИЯ ЭПИДЕМИИ"
            elif (( $(echo "$rt >= 1.1" | bc -l) )); then
              status_msg="Разрабатываю мероприятия"
              rt_color="yellow"
              mission="ЛИКВИДАЦИЯ ЭПИДЕМИИ"
            elif (( $(echo "$rt >= 0.9" | bc -l) )); then
              status_msg="Ликвидирую очаг"
              rt_color="green"
              mission="ЛИКВИДАЦИЯ ЭПИДЕМИИ"
            elif (( $(echo "$rt >= 0.2" | bc -l) )); then
              status_msg="Провожу РЭА"
              rt_color="brightgreen"
              mission="МОНИТОРИНГ"
            else
              status_msg="Мониторю данные"
              rt_color="blue"
              mission="ПРОФИЛАКТИКА"
            fi
          fi

          echo "RT=$rt" >> $GITHUB_OUTPUT
          echo "RT_COLOR=$rt_color" >> $GITHUB_OUTPUT
          echo "STATUS=$status_msg" >> $GITHUB_OUTPUT
          echo "MISSION=$mission" >> $GITHUB_OUTPUT

      - name: Обновить README.md и сгенерировать файлы бейджей
        run: |
          mkdir -p badges

          # Возраст: число + плейсхолдер
          sed -i -E 's/[0-9]+(\.[0-9]+)?<!-- age_years \(dynamic\) -->/'"${{ steps.age.outputs.AGE_FLOAT }}"'<!-- age_years (dynamic) -->/g' README.md

          # Статус стенда: текст в обратных кавычках + плейсхолдер
          sed -i -E 's/`[^`]*`<!-- stand_status \(dynamic\) -->/`'"${{ steps.stand.outputs.STAND }}"'`<!-- stand_status (dynamic) -->/g' README.md

          # Миссия: текст в обратных кавычках + плейсхолдер
          sed -i -E 's/`[^`]*`<!-- mission \(dynamic\) -->/`'"${{ steps.rt.outputs.MISSION }}"'`<!-- mission (dynamic) -->/g' README.md

          # Генерация JSON в папке badges
          echo "{\"schemaVersion\":1,\"label\":\"Миссия\",\"message\":\"${{ steps.rt.outputs.MISSION }}\",\"color\":\"${{ steps.rt.outputs.RT_COLOR }}\",\"labelColor\":\"${{ steps.rt.outputs.RT_COLOR }}\"}" > badges/mission.json
          echo "{\"schemaVersion\":1,\"label\":\"Rt (активность)\",\"message\":\"${{ steps.rt.outputs.RT }}\",\"color\":\"${{ steps.rt.outputs.RT_COLOR }}\",\"labelColor\":\"${{ steps.rt.outputs.RT_COLOR }}\"}" > badges/rt.json
          echo "{\"schemaVersion\":1,\"label\":\"STATUS\",\"message\":\"${{ steps.rt.outputs.STATUS }}\",\"color\":\"${{ steps.rt.outputs.RT_COLOR }}\",\"labelColor\":\"${{ steps.rt.outputs.RT_COLOR }}\"}" > badges/status.json
          echo "{\"schemaVersion\":1,\"label\":\"Стенд\",\"message\":\"${{ steps.stand.outputs.STAND }}\",\"color\":\"green\",\"labelColor\":\"green\"}" > badges/stand_status.json
          echo "{\"schemaVersion\":1,\"label\":\"Возраст\",\"message\":\"${{ steps.age.outputs.AGE_FLOAT }}\",\"color\":\"blue\",\"labelColor\":\"blue\"}" > badges/age.json          

      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md badges/
          git diff --staged --quiet || git commit -m "docs: обновить терминал и бейджи (возраст, стенд, Rt, миссия)"
          git push