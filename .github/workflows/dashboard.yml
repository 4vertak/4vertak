name: Обновление терминала и дашборда (стенд, Rt, миссия)

on:
  schedule:
    - cron: '0 8 * * *'   # каждый день в 8:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-terminal:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      USERNAME: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Вычислить статус стенда
        id: stand
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$USERNAME"
          query_repos='query($owner:String!) {
            user(login:$owner) {
              repositories(last:10, orderBy:{field:CREATED_AT, direction:DESC}) {
                nodes { createdAt }
              }
            }
          }'
          new_repos=$(gh api graphql -f query="$query_repos" -f owner="$owner" | \
            jq '[.data.user.repositories.nodes[] | select(.createdAt > (now - 2592000 | strftime("%Y-%m-%dT%H:%M:%SZ")))] | length')

          today=$(date -u +%Y-%m-%d)
          month_ago=$(date -u -d '30 days ago' +%Y-%m-%d)
          query_commits='query($owner:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$owner) {
              contributionsCollection(from:$from, to:$to) {
                totalCommitContributions
              }
            }
          }'
          commits=$(gh api graphql -f query="$query_commits" -f owner="$owner" \
            -f from="${month_ago}T00:00:00Z" -f to="${today}T23:59:59Z" | \
            jq '.data.user.contributionsCollection.totalCommitContributions')

          if [ "$new_repos" -gt 0 ]; then
            stand_status="АКТИВЕН"
          elif [ "$commits" -gt 0 ]; then
            stand_status="РАБОТАЕТ"
          else
            stand_status="ПРОСТОЙ"
          fi
          echo "STAND=$stand_status" >> "$GITHUB_OUTPUT"

      - name: Вычислить Rt, статус и миссию
        id: rt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$USERNAME"
          # Два непересекающихся окна по 7 суток, в UTC.
          now_epoch=$(date -u +%s)
          now=$(date -u -d "@$now_epoch" +%Y-%m-%dT%H:%M:%SZ)
          week_ago=$(date -u -d "@$((now_epoch - 7*86400))" +%Y-%m-%dT%H:%M:%SZ)
          previous_end=$(date -u -d "@$((now_epoch - 7*86400 - 1))" +%Y-%m-%dT%H:%M:%SZ)
          two_weeks_ago=$(date -u -d "@$((now_epoch - 14*86400))" +%Y-%m-%dT%H:%M:%SZ)

          query='query($owner:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$owner) {
              contributionsCollection(from:$from, to:$to) {
                totalCommitContributions
              }
            }
          }'
          recent=$(gh api graphql -f query="$query" -f owner="$owner" -f from="$week_ago" -f to="$now" | jq '.data.user.contributionsCollection.totalCommitContributions')
          previous=$(gh api graphql -f query="$query" -f owner="$owner" -f from="$two_weeks_ago" -f to="$previous_end" | jq '.data.user.contributionsCollection.totalCommitContributions')

          echo "Recent commits (last 7d): $recent"
          echo "Previous commits (7-14d ago): $previous"

          # Игровой индекс активности GitHub, а не эпидемиологическое Rt:
          # коммиты за последние 7 суток / коммиты за предыдущие 7 суток.
          if [ "$recent" -eq 0 ] && [ "$previous" -eq 0 ]; then
            rt="—"
            rt_color="666666"
            status_msg="Нет данных"
            mission="ПОИСК ДАННЫХ"
          elif [ "$previous" -eq 0 ]; then
            # При нулевом знаменателе числовое отношение не определено.
            rt="новая"
            rt_color="33CC33"
            status_msg="Новая активность"
            mission="ЛИКВИДАЦИЯ ЭПИДЕМИИ"
          else
            rt=$(echo "scale=2; $recent / $previous" | bc)
            if (( $(echo "$rt >= 1.5" | bc -l) )); then
              status_msg="Собираю эпидданные"
              rt_color="00FF00"
              mission="ЛИКВИДАЦИЯ ЭПИДЕМИИ"
            elif (( $(echo "$rt >= 1.1" | bc -l) )); then
              status_msg="Разрабатываю мероприятия"
              rt_color="33CC33"
              mission="ЛИКВИДАЦИЯ ЭПИДЕМИИ"
            elif (( $(echo "$rt >= 0.9" | bc -l) )); then
              status_msg="Ликвидирую очаг"
              rt_color="4C9900"
              mission="ЛИКВИДАЦИЯ ЭПИДЕМИИ"
            elif (( $(echo "$rt >= 0.2" | bc -l) )); then
              status_msg="Провожу РЭА"
              rt_color="556B2F"
              mission="МОНИТОРИНГ"
            else
              status_msg="Мониторю данные"
              rt_color="5A5A5A"
              mission="ПРОФИЛАКТИКА"
            fi
          fi

          echo "RT=$rt" >> "$GITHUB_OUTPUT"
          echo "RT_COLOR=$rt_color" >> "$GITHUB_OUTPUT"
          echo "STATUS=$status_msg" >> "$GITHUB_OUTPUT"
          echo "MISSION=$mission" >> "$GITHUB_OUTPUT"

      - name: Обновить README.md и сгенерировать файлы бейджей
        run: |
          mkdir -p badges

          # Статус стенда: текст в обратных кавычках + плейсхолдер
          sed -i -E 's/`[^`]*`<!-- stand_status \(dynamic\) -->/`'"${{ steps.stand.outputs.STAND }}"'`<!-- stand_status (dynamic) -->/g' README.md

          # Миссия: текст в обратных кавычках + плейсхолдер
          sed -i -E 's/`[^`]*`<!-- mission \(dynamic\) -->/`'"${{ steps.rt.outputs.MISSION }}"'`<!-- mission (dynamic) -->/g' README.md

          # Генерация JSON в папке badges
          echo "{\"schemaVersion\":1,\"label\":\"Миссия\",\"message\":\"${{ steps.rt.outputs.MISSION }}\",\"color\":\"${{ steps.rt.outputs.RT_COLOR }}\",\"labelColor\":\"1A1A1A\"}" > badges/mission.json
          echo "{\"schemaVersion\":1,\"label\":\"Эпид.индекс Rt\",\"message\":\"${{ steps.rt.outputs.RT }}\",\"color\":\"${{ steps.rt.outputs.RT_COLOR }}\",\"labelColor\":\"1A1A1A\"}" > badges/rt.json
          echo "{\"schemaVersion\":1,\"label\":\"STATUS\",\"message\":\"${{ steps.rt.outputs.STATUS }}\",\"color\":\"${{ steps.rt.outputs.RT_COLOR }}\",\"labelColor\":\"1A1A1A\"}" > badges/status.json
          echo "{\"schemaVersion\":1,\"label\":\"Стенд\",\"message\":\"${{ steps.stand.outputs.STAND }}\",\"color\":\"green\",\"labelColor\":\"1A1A1A\"}" > badges/stand_status.json

      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md badges/
          git diff --staged --quiet || git commit -m "docs: обновить терминал и бейджи (стенд, Rt, миссия)"
          git push
