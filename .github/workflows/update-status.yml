name: Update dynamic status
on:
  schedule:
    - cron: '0 9 * * 1'   # каждый понедельник в 9:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Update status.json
        run: |
          # Список статусов, каждый с новой строки
          STATUS=$(printf "Собираю эпидданные\nПровожу РЭА\nРазрабатываю мероприятия\nЛиквидирую очаг\n" | shuf -n 1)

          # Список цветов
          COLOR=$(printf "green\nblue\nyellow\norange\nbrightgreen\n" | shuf -n 1)

          # Генерация JSON без jq (руками, безопасно для sh)
          echo "{\"schemaVersion\":1,\"label\":\"STATUS\",\"message\":\"$STATUS\",\"color\":\"$COLOR\"}" > status.json

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "docs: update dynamic status"
          git push