name: Update dynamic status
on:
  schedule:
    - cron: '0 9 * * 1'   # каждый понедельник в 9:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Update status.json
        run: |
          # Массив статусов
          STATUSES=("Собираю эпидданные" "Провожу РЭА" "Разрабатываю мероприятия" "Ликвидирую очаг")
          
          # Получаем случайный индекс (более надёжный способ, чем RANDOM)
          INDEX=$(shuf -i 0-$((${#STATUSES[@]} - 1)) -n 1)
          STATUS=${STATUSES[$INDEX]}
          
          # Можно выбрать случайный цвет для разнообразия
          COLORS=("green" "blue" "yellow" "orange" "brightgreen")
          COLOR_INDEX=$(shuf -i 0-$((${#COLORS[@]} - 1)) -n 1)
          COLOR=${COLORS[$COLOR_INDEX]}
          
          echo "{\"schemaVersion\":1,\"label\":\"STATUS\",\"message\":\"$STATUS\",\"color\":\"$COLOR\"}" > status.json

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "docs: update dynamic status"
          git push